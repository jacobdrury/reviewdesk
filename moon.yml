id: 'reviewdesk'
language: 'rust'
layer: 'application'

env:
  CARGO_TERM_COLOR: 'always'

fileGroups:
  sources:
    - 'crates/*/src/**/*'
    - 'crates/*/Cargo.toml'
    - 'Cargo.toml'
  tests:
    - 'crates/*/benches/**/*'
    - 'crates/*/tests/**/*'
    - 'crates/*/src/**/*.rs'

tasks:
  run:
    command: 'cargo run -p reviewdesk'
    preset: 'server'
    inputs:
      - '@globs(sources)'

  build:
    command: 'cargo build'
    inputs:
      - '@globs(sources)'

  check:
    command: 'cargo check --workspace'
    inputs:
      - '@globs(sources)'

  format:
    command: 'cargo fmt --all --check'
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'

  lint:
    command: 'cargo clippy --workspace'
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'

  test:
    command: 'cargo test --workspace'
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
