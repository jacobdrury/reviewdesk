[workspace]
resolver = "2"
members = [
  "crates/reviewdesk",
  "crates/reviewdesk-core",
  "crates/reviewdesk-github",
  "crates/reviewdesk-localstore",
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "process"] }
turso = "0.9.0-pre.1"
directories = "6.0.0"
